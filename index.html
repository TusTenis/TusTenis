<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TusTenis</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Poppins&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body,html{margin:0;padding:0;height:100%;font-family:'Poppins',sans-serif;background:#0b0b0b;color:#fff;overflow-x:hidden;}
header{text-align:center;padding:50px;border-bottom:1px solid gold;}
header h1{font-family:'Playfair Display', serif;letter-spacing:5px;font-size:3em;}
header p{color:gold;font-style:italic;font-size:1.2em;}
#brandSearch{display:block;margin:20px auto;padding:15px 25px;width:90%;max-width:500px;border-radius:50px;border:2px solid gold;background:#000;color:gold;font-size:1.1em;text-align:center;transition:.3s;}
#brandSearch:focus{outline:none;box-shadow:0 0 20px rgba(218,165,32,.5);}
#brandIndex{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px;padding:20px;}
.brand-btn{display:flex;justify-content:center;align-items:center;height:200px;background:#111;border-radius:30px;font-size:1.5em;font-weight:bold;color:gold;border:2px solid gold;cursor:pointer;transition:.4s;overflow:hidden;text-transform:uppercase;}
.brand-btn:hover{background:gold;color:#000;transform:scale(1.05);box-shadow:0 10px 30px rgba(218,165,32,.5);}
.container{display:grid;grid-template-columns:3fr 1fr;gap:30px;padding:40px;}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:25px;}
.product{background:#111;padding:20px;border-radius:20px;text-align:center;cursor:grab;transition: transform .4s, box-shadow .4s, opacity .4s;}
.product.dragging{opacity:.3; transform:scale(.95);}
.product.hide{display:none;}
.product:hover{transform: translateY(-10px); box-shadow:0 25px 50px rgba(218,165,32,.25);}
.product img{width:100%; max-width:200px;}
.price{color:gold; font-size:18px;}
button.cart-btn{margin-top:10px; padding:10px 30px; border-radius:30px; border:none; background:linear-gradient(135deg,#ffd700,#ffb700); color:#000; font-weight:bold; font-size:1em; cursor:pointer; transition:.3s;}
button.cart-btn:hover{background:linear-gradient(135deg,#ffb700,#ffd700); transform:scale(1.05);}
.cart{background:#111; padding:20px; border-radius:20px;}
.cart h2{text-align:center;color:gold;}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #333;}
.remove{background:crimson;border:none;border-radius:50%;width:25px;height:25px;color:#fff;cursor:pointer;}
.total{margin-top:15px;font-weight:bold;color:gold;}
.filters{display:flex;gap:15px;justify-content:center;padding:15px;background:#111;flex-wrap:wrap;margin-bottom:15px;align-items:center;}
select,input{padding:12px 18px;background:#000;color:#fff;border:1px solid gold;border-radius:30px;transition:.3s;}
select:hover,input:hover{box-shadow:0 0 20px rgba(218,165,32,.4);transform:scale(1.05);}

#whatsappBtn {
  background: #0b0b0b;
  color: gold;
  border: 2px solid gold;
  border-radius: 30px;
  padding: 15px 40px;
  font-weight: 900;
  font-size: 1.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: box-shadow 0.4s ease, background-color 0.4s ease, color 0.4s ease;
  width: 100%;
  margin-top: 20px;
  letter-spacing: 2px;
  box-shadow: 0 0 10px rgba(218,165,32,0.7);
}
#whatsappBtn:hover {
  background: gold;
  color: #000;
  box-shadow: 0 0 30px rgba(218,165,32,1);
}

/* Botón volver a marcas */
#backToBrands {
  background: transparent;
  color: gold;
  border: 2px solid gold;
  padding: 8px 25px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: 700;
  margin-right: 10px;
  transition: background-color 0.3s, color 0.3s;
}
#backToBrands:hover {
  background: gold;
  color: #000;
}

/* Botón sugerencias */
#sugerenciaBtn{position:fixed;bottom:20px;right:20px;padding:15px 25px;border-radius:50px;border:2px solid gold;background:transparent;color:gold;font-weight:bold;cursor:pointer;transition:.3s;z-index:999;}
#sugerenciaBtn:hover{background:gold;color:#000;}

@media(max-width:500px){
  .brand-btn{height:150px;font-size:1.2em;}
  .container{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<header>
<h1>TusTenis</h1>
<p>Tu tienda de tenis de lujo</p>
</header>

<input type="text" id="brandSearch" placeholder="Buscar marca...">

<div id="brandIndex"></div>

<div class="filters" id="filtersSection" style="display:none; align-items:center;">
<button id="backToBrands" style="display:none;">← Volver a marcas</button>
<input type="text" id="searchInput" placeholder="Buscar por nombre...">
<select id="genderFilter">
    <option value="" disabled hidden>Género</option>
    <option value="all">Eliminar filtros</option>
    <option value="hombre">Hombre</option>
    <option value="mujer">Mujer</option>
</select>
<input type="number" id="priceFilter" placeholder="Precio máximo">
</div>

<div class="container" id="productSection" style="display:none;">
<div class="products" id="products"></div>

<div class="cart">
<h2>Carrito</h2>
<div id="cartItems"></div>
<div class="total" id="total">Total: $0</div>
<button id="whatsappBtn">Comprar por WhatsApp</button>
</div>
</div>

<button id="sugerenciaBtn">Enviar sugerencia</button>

<script>
let total = 0;
let currentBrand = null;

function addToCart(name, price, size) {
    const cart = document.getElementById("cartItems");
    const item = document.createElement("div");
    item.className = "cart-item";
    item.innerHTML = `<span>${name} - $${price} - Talla: ${size}</span>
                      <button class="remove">×</button>`;
    item.querySelector(".remove").onclick = () => {
        cart.removeChild(item);
        total -= price;
        updateTotal();
    };
    cart.appendChild(item);
    total += price;
    updateTotal();
}
function updateTotal() { document.getElementById("total").innerText = `Total: $${total}`; }

const searchInput = document.getElementById("searchInput");
const genderFilter = document.getElementById("genderFilter");
const priceFilter = document.getElementById("priceFilter");

document.querySelectorAll("select,input").forEach(el => el.addEventListener("input", filterProducts));

function filterProducts(){
    const gender = genderFilter.value;
    const price = priceFilter.value;
    const search = searchInput.value.toLowerCase();

    document.querySelectorAll(".product").forEach(p => {
        let ok = true;
        if(currentBrand) ok = ok && (p.dataset.brand === currentBrand);
        if(gender && gender!=="all") ok = ok && (p.dataset.gender === gender);
        if(price) ok = ok && (p.dataset.price <= price);
        if(search) ok = ok && p.querySelector("h3").innerText.toLowerCase().includes(search);
        p.classList.toggle("hide", !ok);
    });

    if(gender==="all"){genderFilter.value=""; filterProducts();}
}

const container = document.getElementById("products");
let dragged = null;
container.addEventListener("dragstart", e => { if(e.target.classList.contains("product")) { dragged=e.target; e.target.classList.add("dragging"); } });
container.addEventListener("dragend", e => e.target.classList.remove("dragging"));
container.addEventListener("dragover", e => {
    e.preventDefault();
    const after = getDragAfter(container, e.clientY);
    if(after==null) container.appendChild(dragged);
    else container.insertBefore(dragged, after);
});
function getDragAfter(container, y){
    const items = [...container.querySelectorAll(".product:not(.dragging):not(.hide)")];
    return items.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height/2;
        if(offset<0 && offset>closest.offset) return {offset, element: child};
        return closest;
    }, {offset:Number.NEGATIVE_INFINITY}).element;
}

document.getElementById("whatsappBtn").addEventListener("click", ()=>{
    const cartItems = document.querySelectorAll("#cartItems .cart-item span");
    if(cartItems.length===0){ alert("Tu carrito está vacío"); return; }
    let mensaje = "Hola, quiero comprar estos productos:%0A";
    cartItems.forEach(item => mensaje += "- " + encodeURIComponent(item.innerText) + "%0A");
    mensaje += `Total: $${total}%0A`;
    const numero = "5214772303118";
    window.open(`https://wa.me/${numero}?text=${mensaje}`, "_blank");
});

document.getElementById("sugerenciaBtn").addEventListener("click", ()=>{
    const numero = "5214772303118";
    const mensaje = encodeURIComponent("Hola, quiero sugerir un nuevo producto para TusTenis.");
    window.open(`https://wa.me/${numero}?text=${mensaje}`, "_blank");
});

const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDcFWaWQkTKU7QqKnYXCBUC2G6qcLWsIcpk-rta-k1mQP1Oji1PWrVo6EpH-_RurxhTfOYT2ToR385/pub?output=csv";
let allProducts = [];

fetch(sheetCSVUrl)
.then(res => res.text())
.then(data => {
    let rows = data.split('\n').slice(1);
    allProducts = rows.map(r => {
        const [nombre, marca, genero, precio, tallas, imagen] = r.split(',');
        return {nombre, marca, genero, precio, tallas, imagen};
    }).filter(p => p.nombre);

    allProducts.sort((a,b)=>a.nombre.localeCompare(b.nombre));

    let brandSet = new Set();
    allProducts.forEach(p=>brandSet.add(p.marca.toLowerCase()));
    const brandIndex = document.getElementById("brandIndex");

    brandSet.forEach(brand=>{
        const btn = document.createElement("div");
        btn.className = "brand-btn";
        btn.textContent = brand.charAt(0).toUpperCase()+brand.slice(1);
        btn.dataset.brand = brand;
        btn.onclick = ()=>{
            currentBrand = brand;
            showProductsByBrand(allProducts, brand);
            // Ocultar marcas y buscador, mostrar productos y filtros
            brandIndex.style.display = "none";
            document.getElementById("brandSearch").style.display = "none";
            document.getElementById("filtersSection").style.display = "flex";
            document.getElementById("productSection").style.display = "grid";
            document.getElementById("backToBrands").style.display = "inline-block";
        };
        brandIndex.appendChild(btn);
    });

    // Filtrar marcas en buscador
    const brandSearch = document.getElementById("brandSearch");
    brandSearch.addEventListener("input", ()=>{
        const query = brandSearch.value.toLowerCase();
        document.querySelectorAll(".brand-btn").forEach(btn=>{
            btn.style.display = btn.textContent.toLowerCase().includes(query) ? "flex" : "none";
        });
    });
});

function showProductsByBrand(products, brand){
    const container = document.getElementById("products");
    container.innerHTML = "";

    products.filter(p=>p.marca.toLowerCase()===brand)
    .forEach(p=>{
        const prodDiv = document.createElement('div');
        prodDiv.className = 'product';
        prodDiv.dataset.brand = p.marca.toLowerCase();
        prodDiv.dataset.gender = p.genero.toLowerCase();
        prodDiv.dataset.price = p.precio;
        prodDiv.setAttribute("draggable","true");
        prodDiv.innerHTML=`
            <img src="${p.imagen}" alt="${p.nombre}">
            <h3>${p.nombre}</h3>
            <p class="price">$${p.precio}</p>
            <label>Talla:</label>
            <select class="sizeSelector">${p.tallas.split('|').map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
            <button class="cart-btn" onclick="addToCart('${p.nombre}', ${p.precio}, this.previousElementSibling.value)">Agregar</button>
        `;
        container.appendChild(prodDiv);
    });
    filterProducts();
}

// Volver al índice de marcas
document.getElementById("backToBrands").onclick = ()=>{
    document.getElementById("brandIndex").style.display = "grid";
    document.getElementById("brandSearch").style.display = "block";
    document.getElementById("filtersSection").style.display = "none";
    document.getElementById("productSection").style.display = "none";
    document.getElementById("backToBrands").style.display = "none";
    currentBrand = null;
};

</script>
</body>
</html>
